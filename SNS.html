<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bio SNS Simulator</title>
<style>
body{margin:0;background:#050812;color:#e9eefc;font-family:-apple-system}
canvas{display:block}
#hud{position:absolute;top:10px;left:10px;font-size:13px}
button{padding:10px;margin:4px;border-radius:10px}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
<div>生物度: <span id="bio">0</span></div>
<div>反映速度: <span id="rate">0</span></div>
<div>C: <span id="coh">0</span></div>
</div>

<button id="fileBtn">曲を選択</button>
<input id="audioFile" type="file" accept="audio/*" style="display:none">

<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let W,H;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;}
resize();onresize=resize;

/* ===== 音楽 ===== */
let ac,ae,an,src;

document.getElementById("fileBtn").onclick=()=>{
  let f=document.getElementById("audioFile");
  f.value="";
  f.click();
};

document.getElementById("audioFile").onchange=async(e)=>{
  let file=e.target.files[0];
  if(!file)return;

  if(!ac)ac=new (AudioContext||webkitAudioContext)();

  if(ac.state==="suspended")await ac.resume();

  ae=new Audio(URL.createObjectURL(file));
  ae.loop=true;

  an=ac.createAnalyser();
  src=ac.createMediaElementSource(ae);
  src.connect(an);
  an.connect(ac.destination);

  ae.play();
};
</script>

</body>
</html>
