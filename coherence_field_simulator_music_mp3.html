<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music Controlled Coherence Field</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050812;color:#e9eefc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Meiryo,sans-serif}#app{display:grid;grid-template-columns:390px 1fr;height:100%}#side{padding:16px;overflow:auto;background:rgba(13,18,32,.95);border-right:1px solid #ffffff22}.card{background:#ffffff0a;border:1px solid #ffffff22;border-radius:16px;padding:13px;margin-bottom:12px}h1{font-size:19px;margin:0 0 8px}.sub,.desc{font-size:12px;color:#9bb0d3;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center;margin:8px 0}label{font-size:12px;color:#9bb0d3}input[type=range]{width:100%;accent-color:#64d2ff}select,input[type=file],button{width:100%;box-sizing:border-box;margin-top:6px;padding:9px;border-radius:10px;border:1px solid #ffffff22;background:#10182e;color:#e9eefc}.val{text-align:right;background:#ffffff11;border-radius:9px;padding:5px;font-size:12px}.row{display:flex;gap:8px}button{cursor:pointer;background:#64d2ff22}.pill{display:inline-block;font-size:11px;border:1px solid #64d2ff55;color:#64d2ff;border-radius:99px;padding:2px 8px;margin:2px}#main{position:relative}canvas#c{position:absolute;inset:0;width:100%;height:100%}#hud{position:absolute;right:14px;top:14px;width:310px}.hud{background:rgba(20,27,46,.94);border:1px solid #ffffff22;border-radius:16px;padding:12px;margin-bottom:10px}.m{display:flex;justify-content:space-between;font-size:13px;margin:5px 0}#plot{width:100%;height:88px;background:#ffffff08;border-radius:10px}@media(max-width:900px){#app{grid-template-columns:1fr}#side{position:absolute;z-index:5;left:10px;top:10px;width:min(390px,calc(100% - 20px));max-height:calc(100% - 20px);border-radius:16px}}</style></head><body><div id="app"><aside id="side"><div class="card"><h1>Music Controlled Coherence Field</h1><div class="sub">MP3/WAVを読み込み、RMS・低域・中域・高域・スペクトル重心で場 Φ / 履歴 M / 整合 E / 個体同期を制御します。</div></div><div class="card"><label>組織プリセット</label><select id="preset"></select><div id="pdesc" class="desc"></div></div><div class="card"><h1 style="font-size:16px">音楽入力</h1><input id="audioFile" type="file" accept="audio/*"><div class="grid"><div><label>音楽→場 影響</label><input id="audioInfluence" type="range" min="0" max="3" step="0.01" value="1.00"></div><div class="val" id="audioInfluenceVal">1.00</div></div><div class="grid"><div><label>音楽同期ゲイン</label><input id="musicSync" type="range" min="0" max="3" step="0.01" value="0.80"></div><div class="val" id="musicSyncVal">0.80</div></div><div class="row"><button id="playBtn">再生/一時停止</button><button id="stopBtn">停止</button></div><div id="audioInfo" class="desc">Audio: 未入力</div></div><div class="card" id="controls"></div><div class="card"><div class="row"><button id="reset">リセット</button><button id="stim">刺激</button><button id="split">分裂</button><button id="pause">一時停止</button></div></div></aside><main id="main"><canvas id="c"></canvas><div id="hud"><div class="hud"><div class="m"><span>平均C</span><span id="coh">0</span></div><div class="m"><span>|dC/dt|</span><span id="fluc">0</span></div><div class="m"><span>τ</span><span id="tau">0</span></div><div class="m"><span>クラスタ</span><span id="clusters">0</span></div><div class="m"><span>RMS</span><span id="rms">0</span></div><div class="m"><span>B/M/T</span><span id="bands">0/0/0</span></div></div><div class="hud"><canvas id="plot" width="310" height="88"></canvas></div></div></main></div><script>const PRESETS={"地域社会": {"count": 32, "coupling": 0.64, "noise": 0.032, "fieldGain": 0.72, "memoryGain": 0.76, "cohGain": 0.7, "sensorDrift": 0.018, "connectRadius": 180, "agentSpeed": 1.15, "desc": "場所の記憶が強く、ゆるい同期と複数クラスタが共存する。"}, "地方・田舎": {"count": 18, "coupling": 0.72, "noise": 0.022, "fieldGain": 0.78, "memoryGain": 0.82, "cohGain": 0.78, "sensorDrift": 0.012, "connectRadius": 190, "agentSpeed": 1.05, "desc": "近距離結合と履歴が強く、関係が長く残る。"}, "都会": {"count": 60, "coupling": 0.24, "noise": 0.075, "fieldGain": 0.38, "memoryGain": 0.18, "cohGain": 0.3, "sensorDrift": 0.055, "connectRadius": 95, "agentSpeed": 2.45, "desc": "個体数が多く、流動性・外界入力が強い。"}, "職場": {"count": 28, "coupling": 0.58, "noise": 0.035, "fieldGain": 0.55, "memoryGain": 0.55, "cohGain": 0.68, "sensorDrift": 0.018, "connectRadius": 150, "agentSpeed": 1.35, "desc": "タスク中心の中結合。部署的クラスタが形成されやすい。"}, "コミュニティー": {"count": 24, "coupling": 0.76, "noise": 0.03, "fieldGain": 0.64, "memoryGain": 0.62, "cohGain": 0.84, "sensorDrift": 0.014, "connectRadius": 165, "agentSpeed": 1.25, "desc": "共通関心による高めの整合性。"}, "サロン": {"count": 20, "coupling": 0.52, "noise": 0.06, "fieldGain": 0.58, "memoryGain": 0.32, "cohGain": 0.52, "sensorDrift": 0.035, "connectRadius": 145, "agentSpeed": 1.6, "desc": "適度な揺らぎと軽い結合。"}, "趣味仲間": {"count": 22, "coupling": 0.82, "noise": 0.025, "fieldGain": 0.48, "memoryGain": 0.45, "cohGain": 0.88, "sensorDrift": 0.012, "connectRadius": 155, "agentSpeed": 1.45, "desc": "共通の趣味で位相が合いやすい。"}, "孤独化": {"count": 18, "coupling": 0.04, "noise": 0.09, "fieldGain": 0.18, "memoryGain": 0.08, "cohGain": 0.05, "sensorDrift": 0.045, "connectRadius": 70, "agentSpeed": 1.2, "desc": "結合半径と同期が小さく、孤立しやすい。"}, "日本企業": {"count": 36, "coupling": 0.88, "noise": 0.018, "fieldGain": 0.7, "memoryGain": 0.86, "cohGain": 0.9, "sensorDrift": 0.01, "connectRadius": 178, "agentSpeed": 1.05, "desc": "高同期・高履歴・高整合。"}, "米国企業": {"count": 34, "coupling": 0.42, "noise": 0.065, "fieldGain": 0.42, "memoryGain": 0.28, "cohGain": 0.48, "sensorDrift": 0.035, "connectRadius": 130, "agentSpeed": 2.05, "desc": "自律性と流動性が高い。"}, "中国企業": {"count": 42, "coupling": 0.7, "noise": 0.05, "fieldGain": 0.62, "memoryGain": 0.48, "cohGain": 0.74, "sensorDrift": 0.045, "connectRadius": 160, "agentSpeed": 2.25, "desc": "高密度・高速・強結合。"}, "光産業創成大学院大学": {"count": 24, "coupling": 0.5, "noise": 0.085, "fieldGain": 0.84, "memoryGain": 0.4, "cohGain": 0.62, "sensorDrift": 0.03, "connectRadius": 145, "agentSpeed": 1.55, "desc": "研究創発・高い場感度。"}, "浜松ホトニクス": {"count": 34, "coupling": 0.74, "noise": 0.02, "fieldGain": 0.88, "memoryGain": 0.78, "cohGain": 0.92, "sensorDrift": 0.01, "connectRadius": 170, "agentSpeed": 1.15, "desc": "精密・長期履歴・高コヒーレンス。"}, "スズキ自動車": {"count": 38, "coupling": 0.62, "noise": 0.035, "fieldGain": 0.58, "memoryGain": 0.62, "cohGain": 0.72, "sensorDrift": 0.018, "connectRadius": 150, "agentSpeed": 1.65, "desc": "現場適応・軽快な同期。"}, "ヤマハ発動機": {"count": 34, "coupling": 0.58, "noise": 0.055, "fieldGain": 0.62, "memoryGain": 0.46, "cohGain": 0.66, "sensorDrift": 0.025, "connectRadius": 145, "agentSpeed": 2.15, "desc": "運動性・速度・リズム。"}, "トヨタ": {"count": 48, "coupling": 0.76, "noise": 0.02, "fieldGain": 0.66, "memoryGain": 0.82, "cohGain": 0.86, "sensorDrift": 0.012, "connectRadius": 172, "agentSpeed": 1.32, "desc": "プロセス履歴と分業クラスタ。"}, "日産": {"count": 38, "coupling": 0.5, "noise": 0.06, "fieldGain": 0.55, "memoryGain": 0.42, "cohGain": 0.58, "sensorDrift": 0.032, "connectRadius": 138, "agentSpeed": 1.8, "desc": "再編や新クラスタ形成。"}, "日立": {"count": 44, "coupling": 0.68, "noise": 0.028, "fieldGain": 0.72, "memoryGain": 0.76, "cohGain": 0.8, "sensorDrift": 0.016, "connectRadius": 168, "agentSpeed": 1.35, "desc": "インフラ的な安定構造。"}, "ソニー": {"count": 36, "coupling": 0.44, "noise": 0.085, "fieldGain": 0.6, "memoryGain": 0.32, "cohGain": 0.56, "sensorDrift": 0.04, "connectRadius": 128, "agentSpeed": 2.05, "desc": "創造性・揺らぎ・独立性。"}};
const defs=[['agentCount','個体数',2,120,1],['coupling','結合K',0,2,.01],['noise','揺らぎξ',0,.35,.001],['fieldGain','場Φ',0,2,.01],['memoryGain','履歴M',0,2,.01],['cohGain','整合E',0,2,.01],['sensorDrift','外界入力',0,.35,.001],['connectRadius','接続半径',60,280,1],['agentSpeed','速度',.2,4,.01]];
const $=id=>document.getElementById(id),ctrl={},val={};defs.forEach(d=>{let r=document.createElement('div');r.className='grid';r.innerHTML='<div><label>'+d[1]+'</label><input id="'+d[0]+'" type="range" min="'+d[2]+'" max="'+d[3]+'" step="'+d[4]+'"></div><div class="val" id="'+d[0]+'Val"></div>';$('controls').appendChild(r);ctrl[d[0]]=$(d[0]);val[d[0]]=$(d[0]+'Val')});
let P={count:30,coupling:.5,noise:.03,fieldGain:.6,memoryGain:.5,cohGain:.6,sensorDrift:.02,connectRadius:150,agentSpeed:1.4,fieldResolution:38,clickRadius:110};let canvas=$('c'),ctx=canvas.getContext('2d'),main=$('main'),plot=$('plot'),pctx=plot.getContext('2d');let W,H,fw,fh,cw,ch,agents=[],phi,next,mem,eco,hist=[],prevC=0,T=0,paused=false,ptr={x:0,y:0,down:false,inv:false};let ac=null,ae=null,src=null,an=null,fd=null,td=null,music={on:false,rms:0,bass:0,mid:0,treble:0,centroid:0,phase:0,inf:1,sync:.8};
function read(){P.count=+ctrl.agentCount.value;P.coupling=+ctrl.coupling.value;P.noise=+ctrl.noise.value;P.fieldGain=+ctrl.fieldGain.value;P.memoryGain=+ctrl.memoryGain.value;P.cohGain=+ctrl.cohGain.value;P.sensorDrift=+ctrl.sensorDrift.value;P.connectRadius=+ctrl.connectRadius.value;P.agentSpeed=+ctrl.agentSpeed.value;Object.keys(val).forEach(k=>val[k].textContent=(k==='agentCount'||k==='connectRadius')?Math.round(P[k]):Number(P[k]).toFixed(k==='noise'||k==='sensorDrift'?3:2));music.inf=+$('audioInfluence').value;music.sync=+$('musicSync').value;$('audioInfluenceVal').textContent=music.inf.toFixed(2);$('musicSyncVal').textContent=music.sync.toFixed(2)}
function apply(name){let p=PRESETS[name];Object.keys(p).forEach(k=>{if(ctrl[k])ctrl[k].value=p[k]});$('pdesc').textContent=p.desc;read();reset(true)}
function init(){Object.keys(PRESETS).forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;$('preset').appendChild(o)});$('preset').onchange=e=>apply(e.target.value);defs.forEach(d=>ctrl[d[0]].oninput=()=>{read();if(d[0]==='agentCount')reset(true)});$('audioInfluence').oninput=read;$('musicSync').oninput=read;$('reset').onclick=()=>reset(true);$('stim').onclick=randomStim;$('split').onclick=split;$('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'再開':'一時停止'};setupAudio();resize();$('preset').value='地域社会';apply('地域社会');requestAnimationFrame(frame)}
function setupAudio(){$('audioFile').onchange=e=>{let f=e.target.files[0];if(!f)return;if(ae){ae.pause()}ae=new Audio();ae.src=URL.createObjectURL(f);ae.loop=true;if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.78;fd=new Uint8Array(an.frequencyBinCount);td=new Uint8Array(an.fftSize);if(src)try{src.disconnect()}catch(e){}src=ac.createMediaElementSource(ae);src.connect(an);an.connect(ac.destination);music.on=true;$('audioInfo').textContent='Audio: '+f.name};$('playBtn').onclick=async()=>{if(!ae)return;if(ac.state==='suspended')await ac.resume();ae.paused?ae.play():ae.pause()};$('stopBtn').onclick=()=>{if(ae){ae.pause();ae.currentTime=0}music.on=false}};
function resize(){let r=main.getBoundingClientRect();W=canvas.width=Math.max(300,r.width|0);H=canvas.height=Math.max(300,r.height|0);fw=P.fieldResolution;fh=Math.max(18,Math.round(fw*H/W));cw=W/fw;ch=H/fh;alloc();reset(false)}window.onresize=resize;function alloc(){let n=fw*fh;phi=new Float32Array(n);next=new Float32Array(n);mem=new Float32Array(n);eco=new Float32Array(n)}function id(x,y){x=Math.max(0,Math.min(fw-1,x));y=Math.max(0,Math.min(fh-1,y));return y*fw+x}function fAt(x,y,a=phi){return a[id(Math.floor(x/cw),Math.floor(y/ch))]||0}function wrap(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}
function reset(re=true){read();for(let i=0;i<phi.length;i++){phi[i]=(Math.random()-.5)*.02;mem[i]=0;eco[i]=0}hist=[];prevC=0;T=0;if(re)agents=[];while(agents.length>P.count)agents.pop();while(agents.length<P.count)agents.push({x:Math.random()*W,y:Math.random()*H,th:Math.random()*6.28,ph:Math.random()*6.28})}
function pair(a,b){return .65*Math.cos(a.ph-b.ph)+.35*Math.cos(a.th-b.th)}function audioFeatures(){if(!an||!ae||ae.paused){music.rms*=.94;music.bass*=.94;music.mid*=.94;music.treble*=.94;return}an.getByteFrequencyData(fd);an.getByteTimeDomainData(td);let s=0;for(let v of td){let x=(v-128)/128;s+=x*x}music.rms=Math.sqrt(s/td.length);let n=fd.length,b=0,m=0,t=0,bc=0,mc=0,tc=0,ws=0,ss=0;for(let i=0;i<n;i++){let v=fd[i]/255;if(i<n*.18){b+=v;bc++}else if(i<n*.55){m+=v;mc++}else{t+=v;tc++}ws+=i*v;ss+=v}music.bass=b/(bc||1);music.mid=m/(mc||1);music.treble=t/(tc||1);music.centroid=ss?ws/(ss*n):0;music.phase+=.035+music.bass*.12+music.rms*.08;$('rms').textContent=music.rms.toFixed(3);$('bands').textContent=music.bass.toFixed(2)+'/'+music.mid.toFixed(2)+'/'+music.treble.toFixed(2);$('audioInfo').textContent='RMS '+music.rms.toFixed(3)+' / Centroid '+music.centroid.toFixed(3)}
function inject(x,y,sg=1){let r=P.clickRadius;for(let gy=0;gy<fh;gy++)for(let gx=0;gx<fw;gx++){let X=gx*cw+cw/2,Y=gy*ch+ch/2,d=(X-x)**2+(Y-y)**2;if(d<r*r){let k=Math.exp(-d/(r*r*.38)),i=id(gx,gy);phi[i]+=sg*.12*k;mem[i]+=sg*.03*k}}}function musicField(){let amp=music.inf*(music.rms*.8+music.bass*.45+music.mid*.25);if(amp<.001)return;let cx=W*(.5+.28*Math.sin(music.phase*.37)),cy=H*(.5+.25*Math.cos(music.phase*.29)),r=70+160*music.bass+90*music.mid;for(let gy=0;gy<fh;gy++)for(let gx=0;gx<fw;gx++){let X=gx*cw+cw/2,Y=gy*ch+ch/2,d=(X-cx)**2+(Y-cy)**2;if(d<r*r){let k=Math.exp(-d/(r*r*.42)),i=id(gx,gy);phi[i]+=amp*.025*k*Math.sin(music.phase+gx*.35+gy*.21);eco[i]+=music.sync*music.mid*.006*k;mem[i]+=music.bass*.003*k}}}
function updateField(){for(let y=0;y<fh;y++)for(let x=0;x<fw;x++){let i=id(x,y),c=phi[i],lap=phi[id(x-1,y)]+phi[id(x+1,y)]+phi[id(x,y-1)]+phi[id(x,y+1)]-4*c;let sensor=(Math.random()-.5)*P.sensorDrift+.008*Math.sin(x/fw*6.28+performance.now()*.0005);next[i]=Math.max(-1.4,Math.min(1.4,c+.18*lap-.04*c+P.memoryGain*mem[i]+P.cohGain*eco[i]+sensor))}let tmp=phi;phi=next;next=tmp;for(let i=0;i<mem.length;i++){mem[i]*=.992;eco[i]*=.985}}
function updateAgents(){let R=P.connectRadius,R2=R*R,Cs=0,np=0;for(let i=0;i<agents.length;i++){let a=agents[i],dt=0,dp=0,lc=0,ne=0;for(let j=0;j<agents.length;j++){if(i===j)continue;let b=agents[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2<R2){let w=1-Math.sqrt(d2)/R,c=pair(a,b);dt+=P.coupling*w*Math.sin(b.th-a.th);dp+=P.coupling*.65*w*Math.sin(b.ph-a.ph);lc+=c;ne++;Cs+=c;np++;eco[id(Math.floor((a.x+b.x)/2/cw),Math.floor((a.y+b.y)/2/ch))]+=c*.004}}let gx=fAt(a.x+cw,a.y)-fAt(a.x-cw,a.y),gy=fAt(a.x,a.y+ch)-fAt(a.x,a.y-ch),fa=Math.atan2(gy,gx);a.th=wrap(a.th+dt+P.fieldGain*.06*wrap(fa-a.th)+music.sync*music.bass*.025*Math.sin(music.phase-a.th)+(Math.random()-.5)*P.noise);a.ph=wrap(a.ph+dp+.015*fAt(a.x,a.y)+.008*fAt(a.x,a.y,mem)+music.sync*music.mid*.035*Math.sin(music.phase-a.ph)+(Math.random()-.5)*P.noise*.7);let sp=P.agentSpeed+.25*Math.sin(a.ph);a.x+=Math.cos(a.th)*sp+gx*.2;a.y+=Math.sin(a.th)*sp+gy*.2;if(a.x<0){a.x=0;a.th=Math.PI-a.th}if(a.x>W){a.x=W;a.th=Math.PI-a.th}if(a.y<0){a.y=0;a.th=-a.th}if(a.y>H){a.y=H;a.th=-a.th}let gi=id(Math.floor(a.x/cw),Math.floor(a.y/ch));phi[gi]+=.002*Math.sin(a.ph);mem[gi]+=.0035*(ne?lc/ne:0)}let C=np?Cs/np:0,dC=Math.abs(C-prevC);T+=dC;prevC=C;hist.push(C);if(hist.length>plot.width)hist.shift();$('coh').textContent=C.toFixed(3);$('fluc').textContent=dC.toFixed(3);$('tau').textContent=T.toFixed(3);$('clusters').textContent=clusterCount()}
function clusterCount(){let v=Array(agents.length).fill(false),n=0,R2=(P.connectRadius*.75)**2;for(let i=0;i<agents.length;i++){if(v[i])continue;n++;let st=[i];v[i]=true;while(st.length){let u=st.pop();for(let w=0;w<agents.length;w++){if(v[w]||u===w)continue;let a=agents[u],b=agents[w];if((a.x-b.x)**2+(a.y-b.y)**2<R2&&pair(a,b)>.55){v[w]=true;st.push(w)}}}}return n}
function drawField(){let img=ctx.createImageData(fw,fh);for(let i=0;i<phi.length;i++){let v=phi[i],e=eco[i],m=mem[i],p=i*4;img.data[p]=Math.min(255,10+Math.max(0,-v)*110+Math.max(0,-m)*55);img.data[p+1]=Math.min(255,18+Math.max(0,v)*70+Math.max(0,e)*90);img.data[p+2]=Math.min(255,36+Math.max(0,v)*140+Math.max(0,e)*40);img.data[p+3]=145}let off=document.createElement('canvas');off.width=fw;off.height=fh;off.getContext('2d').putImageData(img,0,0);ctx.drawImage(off,0,0,W,H)}
function draw(){ctx.clearRect(0,0,W,H);drawField();let R2=P.connectRadius*P.connectRadius;for(let i=0;i<agents.length;i++)for(let j=i+1;j<agents.length;j++){let a=agents[i],b=agents[j],d=(a.x-b.x)**2+(a.y-b.y)**2;if(d<R2){let c=pair(a,b);if(c>.32){ctx.strokeStyle='rgba(100,210,255,'+Math.min(.55,.08+c*.35)+')';ctx.lineWidth=1+c*1.4;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}}for(let a of agents){let hue=((a.ph+Math.PI)/6.28)*360,r=6;ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.th);ctx.fillStyle='hsla('+hue+',92%,62%,.92)';ctx.strokeStyle='white';ctx.beginPath();ctx.moveTo(r+4,0);ctx.lineTo(-r,r*.8);ctx.lineTo(-r*.55,0);ctx.lineTo(-r,-r*.8);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}drawPlot()}function drawPlot(){pctx.clearRect(0,0,plot.width,plot.height);pctx.fillStyle='#ffffff08';pctx.fillRect(0,0,plot.width,plot.height);pctx.strokeStyle='#64d2ff';pctx.beginPath();hist.forEach((v,i)=>{let y=plot.height*(.5-v*.42);i?pctx.lineTo(i,y):pctx.moveTo(i,y)});pctx.stroke()}
function randomStim(){for(let i=0;i<7;i++)inject(Math.random()*W,Math.random()*H,Math.random()>.4?1:-1)}function split(){let h=Math.ceil(agents.length/2);agents.forEach((a,i)=>{a.x=(i<h?.28:.72)*W+(Math.random()-.5)*70;a.y=H*(.25+.5*Math.random());a.th=(i<h?0:Math.PI)+.35+(Math.random()-.5)*.5})}
function frame(){audioFeatures();if(!paused){if(ptr.down)inject(ptr.x,ptr.y,ptr.inv?-1:1);musicField();updateField();updateAgents()}draw();requestAnimationFrame(frame)}function setp(e){let r=canvas.getBoundingClientRect();ptr.x=e.clientX-r.left;ptr.y=e.clientY-r.top;ptr.inv=!!e.shiftKey}canvas.onmousedown=e=>{setp(e);ptr.down=true};window.onmouseup=()=>ptr.down=false;canvas.onmousemove=setp;init();</script></body></html>
